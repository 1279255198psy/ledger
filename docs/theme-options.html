<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>账页 · 配色与图标方向</title>
<style>
  :root {
    --bg: #0c0c0b;
    --card: #151513;
    --card-line: #282822;
    --txt: #ece7db;
    --muted: #918b7e;
    --gold: #c9ad74;
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    margin: 0;
    padding: 64px 44px 96px;
    color: var(--txt);
    background:
      radial-gradient(1000px 560px at 72% -12%, rgba(150, 121, 64, 0.16) 0%, transparent 62%),
      radial-gradient(800px 480px at -8% 108%, rgba(120, 105, 78, 0.08) 0%, transparent 66%),
      var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI Variable", "Segoe UI",
      "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }
  header.page { max-width: 720px; margin-bottom: 56px; }
  .kicker {
    display: inline-flex; align-items: center; gap: 10px;
    margin-bottom: 18px; color: var(--gold);
    font-size: 10px; font-weight: 650; letter-spacing: 0.28em; text-transform: uppercase;
  }
  .kicker::before { content: ""; width: 26px; height: 1px; background: currentColor; opacity: .7; }
  h1 { margin: 0 0 14px; font-size: 40px; font-weight: 600; letter-spacing: 0.06em; line-height: 1.15; }
  .lede { margin: 0; color: var(--muted); font-size: 14.5px; line-height: 1.8; }
  .lede b { color: var(--txt); font-weight: 550; }

  .palettes { display: grid; gap: 26px; }
  .palette {
    padding: 26px 26px 22px;
    background: linear-gradient(180deg, rgba(255,255,255,0.022), rgba(255,255,255,0));
    border: 1px solid var(--card-line);
    border-radius: 20px;
  }
  .palette-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 4px; }
  .palette-index {
    color: var(--muted); font-size: 10px; font-weight: 650; letter-spacing: .22em;
  }
  .palette-name { font-size: 22px; font-weight: 600; letter-spacing: .06em; }
  .palette-en { color: var(--muted); font-size: 9.5px; font-weight: 650; letter-spacing: .24em; }
  .badge {
    margin-left: auto; padding: 5px 11px; color: var(--gold);
    border: 1px solid rgba(201,173,116,.32); border-radius: 999px;
    font-size: 9.5px; font-weight: 650; letter-spacing: .14em;
  }
  .palette-mood { margin: 0 0 22px; color: var(--muted); font-size: 12.5px; line-height: 1.7; max-width: 760px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 900px) { .pair { grid-template-columns: 1fr; } body { padding: 40px 20px 64px; } h1 { font-size: 30px; } }

  .mock {
    overflow: hidden;
    background: var(--page);
    border-radius: 14px;
    box-shadow: 0 18px 44px rgba(0,0,0,.28);
    font-size: 10px;
  }
  .mock-window { display: grid; grid-template-columns: 104px 1fr; min-height: 236px; }
  .mock-side {
    display: flex; flex-direction: column; gap: 6px;
    padding: 16px 12px 14px;
    background: var(--side);
    border-right: 1px solid var(--line);
  }
  .mock-brand { display: flex; align-items: center; gap: 7px; margin-bottom: 14px; color: var(--ink); font-size: 11.5px; font-weight: 650; letter-spacing: .1em; }
  .mock-dot {
    display: grid; place-items: center; width: 22px; height: 22px; flex: 0 0 auto;
    color: var(--on); background: var(--accent); border-radius: 7px;
    font-size: 11px; font-weight: 600; letter-spacing: 0;
  }
  .mock-nav { padding: 6px 8px; color: var(--muted); border-radius: 6px; }
  .mock-nav.is-active { color: var(--accent); background: var(--accentSoft); font-weight: 600; }
  .mock-cta {
    margin-top: auto; padding: 7px 9px; color: var(--on);
    background: var(--accent); border-radius: 7px; text-align: center; font-weight: 600;
  }
  .mock-main { display: flex; flex-direction: column; gap: 12px; padding: 16px 16px 14px; background: var(--page); }
  .mock-hero {
    padding: 14px 15px; color: var(--heroInk);
    background: linear-gradient(140deg, var(--hero) 0%, var(--hero2) 100%);
    border-radius: 10px;
  }
  .mock-eyebrow { display: block; margin-bottom: 5px; color: var(--heroMuted); font-size: 8px; letter-spacing: .12em; }
  .mock-hero strong { display: block; font-size: 21px; font-weight: 600; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
  .mock-hero strong em { font-style: normal; font-size: 12px; opacity: .7; }
  .mock-metrics { display: flex; gap: 16px; margin-top: 10px; padding-top: 9px; border-top: 1px solid rgba(255,255,255,.14); color: var(--heroMuted); font-size: 8.5px; }
  .mock-metrics b { color: var(--heroInk); font-weight: 550; }
  .mock-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { padding: 4px 9px; color: var(--ink2); background: var(--soft); border: 1px solid var(--line); border-radius: 999px; font-size: 8.5px; }
  .chip.is-pos { color: var(--pos); background: var(--posSoft); border-color: transparent; }
  .chip.is-neg { color: var(--neg); background: var(--negSoft); border-color: transparent; }
  .mock-bars { display: flex; align-items: flex-end; gap: 7px; height: 54px; padding: 8px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; }
  .mock-bars i { flex: 1; background: var(--accent); border-radius: 3px 3px 1px 1px; opacity: .82; }
  .mock-bars i:nth-child(even) { background: var(--accentMid); }
  .mock-foot { display: flex; align-items: center; gap: 8px; margin-top: auto; }
  .mock-btn { padding: 6px 11px; color: var(--on); background: var(--accent); border-radius: 6px; font-size: 8.5px; font-weight: 600; }
  .mock-pill { padding: 5px 9px; color: var(--ink2); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; font-size: 8.5px; }
  .mock-label { display: flex; align-items: center; gap: 6px; margin: 0 0 8px 2px; color: var(--muted); font-size: 8.5px; font-weight: 650; letter-spacing: .18em; }

  .swatches { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 18px; }
  .sw { display: inline-flex; align-items: center; gap: 7px; padding: 5px 9px 5px 5px; color: var(--muted); background: rgba(255,255,255,.022); border: 1px solid var(--card-line); border-radius: 7px; font-size: 9.5px; letter-spacing: .02em; }
  .sw i { width: 16px; height: 16px; border-radius: 4px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
  .sw b { color: var(--txt); font-weight: 550; }

  .icons { margin-top: 62px; }
  .icons h2 { margin: 0 0 8px; font-size: 24px; font-weight: 600; letter-spacing: .06em; }
  .icons > p { margin: 0 0 26px; color: var(--muted); font-size: 12.5px; line-height: 1.75; }
  .icon-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
  @media (max-width: 900px) { .icon-grid { grid-template-columns: repeat(2, 1fr); } }
  .icon-card { padding: 22px 20px 18px; background: var(--card); border: 1px solid var(--card-line); border-radius: 18px; text-align: center; }
  .icon-stage {
    display: grid; place-items: center; height: 168px; margin-bottom: 16px;
    background: radial-gradient(circle at 50% 34%, #222019 0%, #131210 68%);
    border-radius: 12px;
  }
  .icon-stage svg { width: 128px; height: 128px; filter: drop-shadow(0 10px 18px rgba(0,0,0,.4)); }
  .icon-title { font-size: 14px; font-weight: 600; letter-spacing: .05em; }
  .icon-en { margin-top: 3px; color: var(--muted); font-size: 8.5px; font-weight: 650; letter-spacing: .2em; }
  .icon-desc { margin: 10px 0 0; color: var(--muted); font-size: 11px; line-height: 1.65; }
  .thumbs { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--card-line); color: var(--muted); font-size: 8.5px; }
  .thumbs span { display: inline-flex; align-items: center; gap: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="page">
    <div class="kicker">账页 · Design Direction</div>
    <h1>四种更沉稳的颜色方向</h1>
    <p class="lede">当前是「森林绿 + 米纸」。下面四套都保留纸张质感与低饱和的安静基调，只换主色与深色模式气质。每套均含<b>浅色 / 深色</b>两种模式的实际界面小样，可直接对比。</p>
  </header>

  <section class="palettes" id="palettes"></section>

  <section class="icons">
    <h2>图标方向 · 不再是正方形</h2>
    <p>四款造型都取自「账簿」的意象，用暗金与墨色重新上色。圆形印章最容易在任务栏 32px 下保持辨识度，也最像一枚落款。</p>
    <div class="icon-grid" id="iconGrid"></div>
  </section>
</div>

    `--page:${p.page}`, `--side:${p.side}`, `--surface:${p.surface}`, `--soft:${p.soft}`,
    `--ink:${p.ink}`, `--ink2:${p.ink2}`, `--muted:${p.muted}`, `--line:${p.line}`,
    `--accent:${p.accent}`, `--accentMid:${p.accentMid}`, `--accentSoft:${p.accentSoft}`,
    `--on:${p.on}`, `--hero:${p.hero}`, `--hero2:${p.hero2}`, `--heroInk:${p.heroInk}`,
    `--heroMuted:${p.heroMuted}`, `--pos:${p.pos}`, `--posSoft:${p.posSoft}`,
    `--neg:${p.neg}`, `--negSoft:${p.negSoft}`
  ].join(';');
}
