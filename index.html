<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f0e7" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta
      name="description"
      content="账页是一款安静、清晰的本地记账应用。记录每一笔收支，看见生活的方向。"
    />
    <title>账页 · 生活账簿</title>
    <script>
      ;(() => {
        try {
          const storedTheme = localStorage.getItem('zhangye.theme.v1')
          const theme =
            storedTheme === 'light' || storedTheme === 'dark'
              ? storedTheme
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          const storedPalette = localStorage.getItem('zhangye.palette.v1')
          const palette = ['forest', 'gold', 'navy', 'copper'].includes(
            storedPalette,
          )
            ? storedPalette
            : 'forest'
          const colors = {
            forest: { light: '#f3f0e7', dark: '#10130f' },
            gold: { light: '#f4f0e6', dark: '#111110' },
            navy: { light: '#f2f0ea', dark: '#0e1216' },
            copper: { light: '#f1efea', dark: '#111213' },
          }
          document.documentElement.dataset.theme = theme
          document.documentElement.dataset.palette = palette
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute('content', colors[palette][theme])
        } catch {
          /* Use the light forest palette. */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
