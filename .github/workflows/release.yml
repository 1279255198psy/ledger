name: Release Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use the default crates.io registry in CI
        shell: pwsh
        run: Remove-Item .cargo/config.toml -ErrorAction SilentlyContinue

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build signed installer and publish draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 账页 v__VERSION__
          releaseBody: |
            账页 v__VERSION__ · 资债、目标储蓄与储蓄到期提醒

            **本次更新**

            - 「负债」升级为「资债」：页面分「储蓄 / 负债」两个栏目，顶部直接展示「流动资金 + 储蓄 − 负债 = 净资产」；储蓄内再分「目标储蓄」和「储蓄资产」。
            - 新增储蓄资产：定期存款、大额存单、国债、银行理财、货币基金、公积金等；支持本金、年化利率、起存日、到期日、自动转存标记，自动估算到期本息，定期到期后可一键本息续存。
            - 新增目标储蓄：为目标单独攒钱，可设目标金额、目标日期并关联项目。开始使用后，关联项目的支出会从这笔储蓄里扣；结束时结算，剩余返还流动资金。不关联项目时，可填实际花掉金额并选择是否写入流水。
            - 目标储蓄会按近 6 个月平均结余推荐每月储蓄额和预计达成月份；关联项目有预算时自动预填目标金额；目标表单内可直接新建项目。
            - 储蓄与目标之间的转入/转回会显示在流水里，但不计入收入、支出、预算和分类统计；净资产按「流动资金 + 储蓄 − 负债」计算，应急金仍只看流动资金。
            - 新增储蓄到期提醒：设置 →「提醒」可单独开启，到期前 3 天和到期当天各推送一次；桌面端驻留托盘也能收到。
            - 概览新增储蓄卡片，资债页新增未来 12 个月到期日历；储蓄数据已纳入 JSON 备份、CSV、双端同步和示例账本。
            - 修复了一些 BUG，电脑版与手机版同步更新。

            覆盖安装即可；升级前建议先在设置中导出一次备份。
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
