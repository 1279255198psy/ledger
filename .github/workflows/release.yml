name: Release Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use the default crates.io registry in CI
        shell: pwsh
        run: Remove-Item .cargo/config.toml -ErrorAction SilentlyContinue

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build signed installer and publish draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 账页 v__VERSION__
          releaseBody: |
            账页 v__VERSION__ · 自动记账诊断

            **本次更新**

            - 「自动记账」新增监听诊断：设置 → 自动记账里能看到微信、支付宝和银行 App 各自被监听服务收到多少条通知、最近一条的原文，以及被哪条规则挡掉。抓不到通知时，这里能直接看出是没收到、还是收到了被过滤。
            - 授权存在但监听服务没被系统连上时，打开设置页会自动请求重新连接，不再无声地空转。
            - 监听服务重新连接时会回读通知栏里最近 10 分钟的通知，补上服务被系统回收期间收到的付款。
            - 没在监听列表里的 App 发来付款类通知时会单独列出来，可以一键加入监听（适用于微信分身、包名不同的银行 App）。
            - 扫描到的通知如果不属于账目，仍然不会进入待标注队列，也不会影响账本数据。

            覆盖安装即可，账本、账户和待标注记录都会保留；升级前建议先在设置中导出一次备份。
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
