name: Release Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use the default crates.io registry in CI
        shell: pwsh
        run: Remove-Item .cargo/config.toml -ErrorAction SilentlyContinue

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build signed installer and publish draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 账页 v__VERSION__
          releaseBody: |
            账页 v__VERSION__ · 手机与电脑在同一 Wi-Fi 下同步账目

            **本次更新**

            - 新增「双端同步」：在同一 Wi-Fi 下，手机输入电脑显示的地址与 10 位同步码，即可让两边的流水、项目、负债、分类、预算与起始资金保持一致，不需要注册账号，也不经过云端服务器。
            - 同步内容使用 AES-256-GCM 端到端加密，电脑只保存密文；地址与同步码只在第一次连接时需要填写，之后自动同步。
            - 首次连接时若两边都已有账目，可选择「合并两边」「以电脑为准」或「以手机为准」。
            - 采用三方合并：以两台设备上次同步时的账本为基准，新增、修改与删除都会保留；同一笔记录两边都被修改时，以更新时间较晚的一方为准。
            - 打开应用、回到前台或改动账目后会自动同步，也可以在设置中手动「立即同步」；手机可随时断开或重新连接，桌面可更换同步码让旧连接失效。
            - 桌面关闭或退出时无法同步；首次开启时请允许 Windows 防火墙的专用网络访问（默认端口 47821）。
            - 同步只涉及账目数据，主题、字号、货币与提醒设置仍各自保留。

            已有的账本与设置都会保留；升级前建议先在设置中导出一次备份。
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
