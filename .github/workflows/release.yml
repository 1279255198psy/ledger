name: Release Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use the default crates.io registry in CI
        shell: pwsh
        run: Remove-Item .cargo/config.toml -ErrorAction SilentlyContinue

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build signed installer and publish draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 账页 v__VERSION__
          releaseBody: |
            账页 v__VERSION__ · 自动备份与连续记账

            **本次更新**

            - 新增本机自动备份：每天首次启动自动留存一份，导入、恢复、清空、重置前也会先备份；最近保留 30 份，另按天保留 14 天。
            - 设置 → 数据管理新增「本机自动备份」：可立即备份、查看、删除，并支持「检查 / 全部检查」在不改动现有数据的前提下验证备份是否完整可恢复。
            - 恢复前会自动再备份当前账本；恢复完成后同步基准一并更新，避免回滚被误判为删除。
            - 手机版「记一笔」移到顶栏右上角，不再与底部保存提示重叠，可连续记录。
            - 包含 3.5.0 的长期存储优化：流水、同步基线与待标注通知改存 IndexedDB，不再受 localStorage 约 5 MB 的限制；设置中可查看本地占用与预计可用年限。

            覆盖安装即可；升级前建议先在设置中导出一次备份。
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
