name: Release Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use the default crates.io registry in CI
        shell: pwsh
        run: Remove-Item .cargo/config.toml -ErrorAction SilentlyContinue

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build signed installer and publish draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 账页 v__VERSION__
          releaseBody: |
            账页 Windows 安装版 v__VERSION__。

            **本次更新**

            - 主题全面重做：松烟绿、琥珀金、远山蓝、曜石铜四套完整主题，均支持浅色纸页与深色夜读。
            - 收入、支出、趋势、图表网格、分类图标、金额卡、标签与提示色都会跟随主题变化，不再只是更换背景色。
            - 月度趋势柱与每日趋势线改用各主题自己的趋势色，不再固定为橙色。
            - 每套主题新增专属纹样与装饰：松烟绿的纸纤维与年轮、琥珀金的日轮与金粉、远山蓝的山岚与星点、曜石铜的斜切晶格与铜屑。
            - 主题选择卡片同步展示纹样，以及收入、支出、趋势三色预览。
            - 应用图标更新为开放式账本图形，并修复升级后 Windows 桌面与任务栏仍显示旧图标的问题；更新后首次启动会自动刷新图标缓存。

            应用启动后会自动检查更新，发现新版本会直接弹窗；可以后台下载并继续记账，下载完成后再选择是否安装。
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
