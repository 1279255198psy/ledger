name: Release Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use the default crates.io registry in CI
        shell: pwsh
        run: Remove-Item .cargo/config.toml -ErrorAction SilentlyContinue

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build signed installer and publish draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 账页 v__VERSION__
          releaseBody: |
            账页 v__VERSION__ · 长期存储优化

            **本次更新**

            - 流水、同步基线和待标注通知改存 IndexedDB，不再受浏览器 localStorage 约 5 MB 的限制；按当前记录速度可用 100 年以上。
            - 升级时自动迁移旧数据并清理旧副本，账本、账户、预算和待标注记录都会保留。
            - 设置 → 数据管理新增「本地占用」，可查看各项占用、存储方式和预计可用年限。
            - 通知队列自动瘦身：已处理记录保留 7 天，队列限制 200 条 / 256 KB，不再重复保存整条通知原文。
            - 本地空间不足时会明确提示，不再静默丢失最新改动。
            - 应用会向系统申请持久存储，降低磁盘紧张时数据被自动清理的概率。

            覆盖安装即可；升级前建议先在设置中导出一次备份。
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
