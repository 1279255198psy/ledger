name: Release Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use the default crates.io registry in CI
        shell: pwsh
        run: Remove-Item .cargo/config.toml -ErrorAction SilentlyContinue

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build signed installer and publish draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 账页 v__VERSION__
          releaseBody: |
            账页 v__VERSION__ · 手机版与自动更新

            **本次更新**

            - 新增 Android 手机版：与电脑版共用同一套界面和账本逻辑，安装包可直接侧载。
            - 手机版支持自动更新：启动后从 GitHub Releases 检查新版本，发现更新后引导下载 APK；网络失败时提供「手动下载」入口。
            - 更新通道按平台自动切换：电脑版只获取 Windows 安装包，手机版只获取 APK，不会拿错版本。
            - 设置页底部新增「在 GitHub 上关注账页」，电脑版和手机版都能直接打开仓库主页与版本发布记录。
            - 电脑版的 GitHub 链接会交给系统默认浏览器打开。

            已有的账本、预算与外观设置都会保留；升级前建议先在设置中导出一次备份。
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
