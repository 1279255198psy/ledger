name: Release Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use the default crates.io registry in CI
        shell: pwsh
        run: Remove-Item .cargo/config.toml -ErrorAction SilentlyContinue

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build signed installer and publish draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 账页 v__VERSION__
          releaseBody: |
            账页 Windows 安装版 v__VERSION__。

            **本次更新**

            - 新增左侧「项目」选项卡，项目从设置中独立出来，成为一级页面。
            - 以日历为底板管理项目：点选日期即可设定开始日与截止日；也可以不设截止，等项目结束后手动结束。
            - 项目以彩色日期条铺在日历上，像一条轻量的甘特时间轴；切换「进行中 / 已结束 / 已归档 / 全部」时，日历与项目列表同步过滤。
            - 项目支持总预算与分类预算：分类预算按该项目下的真实分摊金额汇总，超支时给出提示。
            - 项目本身不设分类，项目里的每一笔消费保留自己的分类；项目详情只做分类归集，不改变每笔流水的分类。
            - 共用支出在项目详情中只显示归入本项目的金额，日常账与项目账各算各的。
            - 项目可以编辑、结束、重新启用、归档与恢复；归档恢复后会回到归档前的状态，长期项目不会被截断。
            - 旧版账本与项目数据继续兼容，升级后原有流水、预算与项目记录均保持不变。

            应用启动后会自动检查更新，发现新版本会直接弹窗；可以后台下载并继续记账，下载完成后再选择是否安装。
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
