name: Release Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use the default crates.io registry in CI
        shell: pwsh
        run: Remove-Item .cargo/config.toml -ErrorAction SilentlyContinue

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build signed installer and publish draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 账页 v__VERSION__
          releaseBody: |
            账页 v__VERSION__ · 自动记账

            **本次更新**

            - 手机版新增「自动记账」：读取微信、支付宝和银行 App 的付款通知，自动生成一条「待标注」记录，金额、日期、付款账户已经填好，只需要补上归属分类和支出性质。
            - 同一笔付款的微信通知和银行通知会合并成一条；记住卡尾号对应的账户后，下次自动填好付款账户。
            - 退款可以标注为「退款」，它会从原分类的支出里扣回，不计入收入，预算和统计也会同步冲减。
            - 待标注记录只保存在这台手机上，不会进入同步；标注确认后才生成正式流水。
            - 设置 →「自动记账」里可以开启通知使用权、勾选要监听的 App，并导出脱敏后的通知样本用于校准解析规则。

            各银行的通知措辞差异较大，建议首次使用时留意金额、收支方向和付款账户是否正确；如果解析结果不对，可以在设置页打开「样本保留」后点「复制脱敏」，把样本反馈回来继续校准。

            电脑端同步了退款的统计口径。已有的账本与设置都会保留；升级前建议先在设置中导出一次备份。
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
