name: Release Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use the default crates.io registry in CI
        shell: pwsh
        run: Remove-Item .cargo/config.toml -ErrorAction SilentlyContinue

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build signed installer and publish draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 账页 v__VERSION__
          releaseBody: |
            账页 v__VERSION__ · 周期记账

            **本次更新**

            - 新增「周期记账」：房租、工资、会员费等固定账，记一笔时打开「设为周期记账」即可。
            - 支持每月某天、每周、每年、隔几天四种频率，可设开始日期和结束日期，也可以一直重复。
            - 每月 31 号遇到短月份自动落在当月最后一天。
            - 到期后可选择「自动入账」直接记进流水，或「等我确认」等金额有变化时逐期确认；漏掉的期数会在下次打开时补齐一次，不会重复生成。
            - 流水页顶部集中管理周期规则：新建、编辑、暂停与删除；待确认的期数可在流水页或概览页直接确认或跳过。
            - 修改某一期时可选择「只改这次」「这次及以后」或「停止规则」。
            - 电脑版与手机版同步更新。

            覆盖安装即可；升级前建议先在设置中导出一次备份。
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
