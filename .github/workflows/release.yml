name: Release Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use the default crates.io registry in CI
        shell: pwsh
        run: Remove-Item .cargo/config.toml -ErrorAction SilentlyContinue

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build signed installer and publish draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 账页 v__VERSION__
          releaseBody: |
            账页 v__VERSION__ · 跨软件导入与预算记录修复

            **本次更新**

            - 新增「导入其他软件」向导：设置 → 数据管理 → 导入其他软件，先预览再确认写入，整批导入可一键撤销。
            - 自动识别微信支付、支付宝、随手记、钱迹、鲨鱼记账、一木记账、喵喵记账、iCost、MoneyWiz 等账单格式，也支持手动对应任意 CSV 的列。
            - 支付宝账单保留原始交易分类，并把部分退款单独记为退款；已关闭的交易自动跳过。微信账单的商户与商品合并进备注，按交易单号去重。
            - 调整好的字段、分类与账户对应关系可以保存为导入模板；下次导入同类账单直接套用，列名变化或分类被删除时会自动回退。
            - 「导出流水表格」新增通用列与「账页扩展」列，可交给其他记账软件或 Excel，导回账页时能恢复刚需/弹性、退款标记等专有字段。
            - 预算调整记录卡片重新排版：与统计页其他卡片一致的内边距、统计小卡和逐条明细，手机上不再拥挤。
            - 修复手机版「历史更新」看不到当前版本高亮的问题：安装包内现在始终携带正在运行的版本记录。
            - 修复双端同步时预算调整记录可能被另一端直接金额覆盖的问题；更完整的调整历史会优先保留。
            - 修复旧版桌面账本文件在升级时可能用一个金额覆盖整本预算的问题。
            - 电脑版与手机版同步更新。

            覆盖安装即可；升级前建议先在设置中导出一次备份。
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
