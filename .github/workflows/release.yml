name: Release Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use the default crates.io registry in CI
        shell: pwsh
        run: Remove-Item .cargo/config.toml -ErrorAction SilentlyContinue

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build signed installer and publish draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 账页 v__VERSION__
          releaseBody: |
            账页 v__VERSION__ · 动态预算与历史更新

            **本次更新**

            - 新增动态预算：概览的本月预算卡片可以随时上调或下调当前预算，原定预算保持不变，并始终显示在卡片下方。
            - 每次动态调整都必须填写原因，自动记录调整时间、调整前后金额与差额；统计页新增「预算调整记录」，汇总上调、下调次数和逐条明细。
            - 手动每日额度可在调整时按剩余天数一键重排：保留今天之前的额度，把剩余预算重新分给今天及之后。
            - 新预算低于本月已用时会先提示，保存后照常显示超支。
            - 设置里的月预算用于设定原定预算，修改不需要填写原因，保存后当前预算同步为该金额。
            - 设置 → 关于账页新增「历史更新」，随安装包保存全部版本记录，没有网络也能查看。
            - 电脑版与手机版同步更新。

            覆盖安装即可；升级前建议先在设置中导出一次备份。
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
