name: Release Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use the default crates.io registry in CI
        shell: pwsh
        run: Remove-Item .cargo/config.toml -ErrorAction SilentlyContinue

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build signed installer and publish draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 账页 v__VERSION__
          releaseBody: |
            账页 v__VERSION__ · 灵活预算与区间预算

            **本次更新**

            - 预算不再是一个固定数字：每个月都可以单独设置自己的金额，换月也能随时调整。
            - 每日预算支持「自动均分」与「手动自定义」。自动模式会按实际花费和剩余天数滚动更新后面的每日额度，超支较多时预警，额度变得过于不合理时提示回头调整月预算。
            - 手动模式同样会提醒每日合计与预算不一致、后续额度不足，并支持一键按整月均分、按剩余预算重排或对齐月预算。
            - 预算可以细化到分类，每个分类单独设上限；概览、侧栏与统计页会同步显示每日额度和分类预算的进度。
            - 新增「区间预算」：可为任意一段日期单独设预算，例如一次旅行或一段装修期。金额、每日额度、分类上限、超支与额度提醒都与月度预算一致。
            - 区间跨月时整段按连续天数计算：每日额度合计只与区间金额对齐，不拆分到各月，也不与月度预算互相校验，两者互不干扰。
            - 设置里的「月度预算」改为「预算」，分为「月度预算」与「区间预算」两个标签页；概览、统计和侧栏都会显示进行中的区间预算，也可以给区间起名字。
            - 完整备份与导入现在包含区间预算；导入旧备份不会清空已有的区间设置。
            - 手机版安装包同步更新，可在应用内检查到 3.1.0。

            已有的账本与外观设置都会保留；升级前建议先在设置中导出一次备份。
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
