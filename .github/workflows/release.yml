name: Release Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use the default crates.io registry in CI
        shell: pwsh
        run: Remove-Item .cargo/config.toml -ErrorAction SilentlyContinue

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build signed installer and publish draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 账页 v__VERSION__
          releaseBody: |
            账页 Windows 安装版 v__VERSION__。

            **本次更新**

            - 曜石铜主题改为玫瑰紫：窗格棱线配胭脂与紫罗兰，与琥珀金彻底区分开，明暗两套都更沉静。
            - 四套主题重新拉开差异，不再只是换底色：
              - 松烟绿：纸纤维与同心年轮；
              - 琥珀金：日轮光束与金粉，收入色改为铜绿，不再与远山蓝撞色；
              - 远山蓝：山岚等高线与星点；
              - 玫瑰紫：玫瑰窗格、同心环与珍珠点。
            - 页底纹样、侧栏留白与「支出构成」卡片都带上了各主题自己的装饰，抬眼就能认出是哪一套。
            - 首页收支构成新增一条按占比拼合的彩色构成带；分类排行与构成条的色条改为按分类上色，居住、餐饮、购物一眼可辨。
            - 主题预览卡的主视觉也带上了各自纹样，明暗切换时同步变化。
            - 旧版本选过曜石铜的用户会自动迁移到玫瑰紫，不需要重新选择。

            应用启动后会自动检查更新，发现新版本会直接弹窗；可以后台下载并继续记账，下载完成后再选择是否安装。
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
