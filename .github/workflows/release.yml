name: Release Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use the default crates.io registry in CI
        shell: pwsh
        run: Remove-Item .cargo/config.toml -ErrorAction SilentlyContinue

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build signed installer and publish draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 账页 v__VERSION__
          releaseBody: |
            账页 Windows 安装版 v__VERSION__。

            **本次更新**

            - 新增字体大小设置：小、标准、大、超大四档。只放大文字，图标与布局尺寸保持不变；选中后立即生效并记住选择。
            - 新增货币设置：人民币、美元、英镑、欧元、日元、韩元。概览、流水、统计图表、记账面板与预算中的金额符号会同步切换；切换只更换符号，不会换算已有金额。
            - 更新检查更快、更稳：单次超时由 20 秒缩短到 8 秒，失败后自动重试最多 3 次；应用保持打开时每 30 分钟在后台复查，失败则 5 分钟后重试，窗口切回前台时也会按需补查。
            - 后台检查只有在发现新版本时才弹窗；选择「下次再说」后不会被反复打扰。手动检查时会显示当前正在第几次重试。

            应用启动后会自动检查更新，发现新版本会直接弹窗；可以后台下载并继续记账，下载完成后再选择是否安装。
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
