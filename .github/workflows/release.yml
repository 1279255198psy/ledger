name: Release Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use the default crates.io registry in CI
        shell: pwsh
        run: Remove-Item .cargo/config.toml -ErrorAction SilentlyContinue

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build signed installer and publish draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 账页 v__VERSION__
          releaseBody: |
            账页 Windows 安装版 v__VERSION__。

            **本次更新**

            - 新增「指数」页：基于本地收支与资产负债流水，自动计算恩格尔系数、储蓄率、必要支出占比、弹性消费占比、应急金覆盖月数、负债收入比和净资产。
            - 新增综合财务健康得分（0–100），附带评语与重点关注建议；得分固定显示，其余指标可自由勾选，默认隐藏负债收入比。
            - 指标卡片支持按月、按季度查看近一年或近两年的历史曲线，并标明参考区间与计算口径。
            - 记账时支出必须标记「刚需 / 弹性」；流水列表会显示对应标签，历史未标记账目按分类自动推断并可逐笔补标。
            - 所有指标均在本机计算，不联网、不上传账目数据。

            应用启动后会自动检查更新，发现新版本会直接弹窗；可以后台下载并继续记账，下载完成后再选择是否安装。
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
