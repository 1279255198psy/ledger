name: Release Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use the default crates.io registry in CI
        shell: pwsh
        run: Remove-Item .cargo/config.toml -ErrorAction SilentlyContinue

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build signed installer and publish draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 账页 v__VERSION__
          releaseBody: |
            账页 v__VERSION__ · 多张银行卡，账户随手管理

            **本次更新**

            - 记一笔与流水的账户选择统一为同一款下拉菜单，按「常用账户 / 银行卡」分组，手机上查看和切换更清楚。
            - 设置新增「账户」页：微信、支付宝与现金固定保留；银行卡可以添加多张，从常用银行中选择或填写自定义银行名称。
            - 卡名重复时会自动加上编号（如「招商银行 2」「招商银行 3」），也可以随时重命名便于区分；已有流水的卡不能删除，避免流水失去归属。
            - 账户数据会随 JSON 备份、电脑端快照和双端同步一起保存；旧版备份或旧版同步对端没有账户字段时，会自动沿用本机的内置钱包。
            - 手机询问「冲突时以哪边为准」时改为下拉菜单选择方案，设置里的「冲突时」也使用同一款菜单。
            - 示例账本已更新，包含小分类、刚需与弹性支出、多张银行卡、独立核算与计入日常的项目、月度与区间预算、负债和起始资金。

            已有的账本与设置都会保留；升级前建议先在设置中导出一次备份。
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
