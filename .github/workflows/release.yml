name: Release Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use the default crates.io registry in CI
        shell: pwsh
        run: Remove-Item .cargo/config.toml -ErrorAction SilentlyContinue

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build signed installer and publish draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 账页 v__VERSION__
          releaseBody: |
            账页 v__VERSION__ · 电脑改动即时同步，连接时可选择优先

            **本次更新**

            - 电脑上的改动现在会自动发布，手机会在停留在账页界面时定期检查，不再需要手动点「立即同步」。
            - 已建立同步后，每次在手机上点「连接电脑」都会先询问冲突时以哪边为准：按最后改动时间、手机优先或电脑优先。
            - 只有同一笔记录在两边都被改过时才会应用这个选择；未冲突的改动始终保留，不会整份覆盖。
            - 「按最后改动时间」比较的是最后一次编辑记录的时间，不是账目日期。
            - 首次连接成功后，可以在同步面板的「冲突时」里把默认值设为「按最后改动时间」，以后连接不再询问；也可以随时改回「每次连接时询问」。
            - 修复在电脑端改动后手机迟迟收不到的问题，以及删除全部账目后手机仍保留旧数据的问题。
            - 手机上的「自动同步」开关只控制手机自己的自动同步；电脑开启同步服务后，改动会自动发布。

            已有的账本与设置都会保留；升级前建议先在设置中导出一次备份。
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
