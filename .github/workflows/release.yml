name: Release Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use the default crates.io registry in CI
        shell: pwsh
        run: Remove-Item .cargo/config.toml -ErrorAction SilentlyContinue

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build signed installer and publish draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 账页 v__VERSION__
          releaseBody: |
            账页 v__VERSION__ · 托盘整理与月度总结余

            **本次更新**

            - 账页现在同一时间只运行一个实例：重复打开只会把已有窗口带到前台，托盘里始终只有一个图标，也不会再出现两个进程同时写账本。
            - 测试版与正式版一眼可分：测试版托盘图标带橙色角标，托盘提示、菜单和窗口标题都标注「测试版」。
            - 测试版不再写入开机自启，也不会覆盖正式版的自启设置；此前残留的测试版自启项已清理。
            - 概览的「总结余」改为按所选月份计算：显示起始资金加上截至该月的收支，切到哪个月就显示哪个月的月末结余，不再固定显示当前总余额。
            - 设置 → 账户 与使用指南里的总结余公式说明同步更新。
            - 电脑版与手机版同步更新。

            覆盖安装即可；升级前建议先在设置中导出一次备份。
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
