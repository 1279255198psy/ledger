name: Release Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use the default crates.io registry in CI
        shell: pwsh
        run: Remove-Item .cargo/config.toml -ErrorAction SilentlyContinue

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build signed installer and publish draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 账页 v__VERSION__
          releaseBody: |
            账页 v__VERSION__ · 设置导航与分类折叠

            **本次更新**

            - 设置改为导航式布局：电脑版在左侧栏切换页面，手机版先看菜单、点进后带返回按钮，和系统设置的使用方式一致。
            - 分类列表默认只显示大分类，点大分类旁的小箭头才展开小分类；分类管理、记一笔和流水筛选都采用同一套折叠方式。
            - 记一笔时新增提示，引导展开大分类并把账目落到更细的小分类。
            - 流水现在同时显示大分类和小分类，例如「交通 · 公交地铁」。
            - 修复分类筛选浮层在窗口右侧和手机端被裁切的问题，展开箭头始终可见。
            - 调整手机端筛选栏布局，类型筛选独占一行，分类与账户下拉各占一半，不再挤成竖排。
            - 手机版安装包同步更新，可在应用内检查到 3.0.1。

            已有的账本、预算与外观设置都会保留；升级前建议先在设置中导出一次备份。
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
