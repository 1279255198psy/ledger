name: Release Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use the default crates.io registry in CI
        shell: pwsh
        run: Remove-Item .cargo/config.toml -ErrorAction SilentlyContinue

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build signed installer and publish draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 账页 v__VERSION__
          releaseBody: |
            账页 v__VERSION__ · 计划与弹窗细节

            **本次更新**

            - 目标弹窗改为左右两栏：左侧填写目标、初始资金和备注，右侧是独立的储蓄计划面板，不再把表单和计划挤在一起。
            - 储蓄计划改成预算式面板，直接展示目标缺口、每月可安排金额、固定还款、其他同时进行目标的占用和近期平均结余。
            - 计划提供「按能力 / 按目标日 / 轻松 / 加速」几种节奏，也可以自定义每月金额；超出可安排结余的方案会标出「超出能力」。
            - 计划时长精确到一位小数，例如约 33.3 个月；预计完成月份仍按真实日历月份显示。
            - 所有弹窗增加左右和底部留白，文字不再贴近弹窗边缘。
            - 修复了一些 BUG，电脑版与手机版同步更新。

            覆盖安装即可；升级前建议先在设置中导出一次备份。
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
