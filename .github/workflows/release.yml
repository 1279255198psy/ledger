name: Release Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use the default crates.io registry in CI
        shell: pwsh
        run: Remove-Item .cargo/config.toml -ErrorAction SilentlyContinue

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build signed installer and publish draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 账页 v__VERSION__
          releaseBody: |
            账页 v__VERSION__ · 项目日常归属与移动端图表修复

            **本次更新**

            - 项目新增「独立核算 / 计入日常」选项，在项目编辑页的「日常预算」里选择。
            - 独立核算（默认，行为与之前一致）：项目花费只计入项目自身预算，不占用每日、月度或区间预算，统计页单列在「项目」中。
            - 计入日常：项目花费同时算作日常支出，会消耗每日额度、月度与区间预算以及分类上限，统计页的每日生活支出也会包含它；项目自己的预算与统计不受影响，金额不会重复计算。
            - 项目详情标题与左侧项目列表会标出当前模式；概览、统计和设置中的相关说明也同步改写。
            - 修复手机版统计页「每日生活支出」折线图最后两个日期标签（如 22 日与 23 日）重叠的问题：窄屏下会按间距省略过密的标签，并始终保留最后一天。
            - 旧账本与已有项目默认按「独立核算」处理；完整备份的导入导出会保留这个设置。
            - 手机版安装包同步更新，可在应用内检查到 3.1.1。

            已有的账本与外观设置都会保留；升级前建议先在设置中导出一次备份。
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
