name: Release Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use the default crates.io registry in CI
        shell: pwsh
        run: Remove-Item .cargo/config.toml -ErrorAction SilentlyContinue

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build signed installer and publish draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 账页 v__VERSION__
          releaseBody: |
            账页 v__VERSION__ · 统计起点与不完整月份

            **本次更新**

            - 新增「统计起点」：设置 → 统计起点 可以指定开始记账的日期，默认自动取最早一笔流水；首月、当前月、未来月份和起点之前的月份会分别标注。
            - 覆盖天数成为统计口径：首月按实际覆盖天数计算日均，月度预算与分类上限在首月按天折算；调整预算时会先还原全额，避免预算越调越小。
            - 统计页图表：未完整的月份用 `*` 标记并说明原因；新增「总额 / 日均」切换，避免把本月至今或首月直接与其他整月比较。
            - 本月支出预测：改为「已发生支出 + 接下来的周期账单 + 近 7 天节奏」，不再按天数线性外推；数据不足时明确提示，不再给出误导性的预测。
            - 指数页：收入稳定性、支出波动率、应急储备、预算执行率等只用完整月份计算；完整月份少于 3 个时显示置信度提示。
            - 概览：统计起点和自动记账的覆盖说明显示在关键指标下方；上个月不完整时，与上月的对比会禁用并说明原因；首月预算显示折算说明。
            - 自动记账：首次读取通知后记录本机的捕获起始日期，概览会说明通知数据从哪一天开始覆盖。
            - 修复了一些 BUG，电脑版与手机版同步更新。

            覆盖安装即可；升级前建议先在设置中导出一次备份。
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
