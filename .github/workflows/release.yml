name: Release Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use the default crates.io registry in CI
        shell: pwsh
        run: Remove-Item .cargo/config.toml -ErrorAction SilentlyContinue

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build signed installer and publish draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 账页 v__VERSION__
          releaseBody: |
            账页 v__VERSION__ · 日期修复与储蓄细节

            **本次更新**

            - 修复手机版日期乱码：Android WebView 会把系统本地化的日期文字叠在界面日期上，储蓄、记一笔、项目、负债、目标、预算和统计起点等所有日期字段现在都只显示清晰的 `2026-11-18`。
            - 流水页的日期范围一并修复，空状态只显示「开始 / 结束 · 选择日期」。
            - 储蓄资产的初始本金现在可以为 0（留空即可），先建好之后再存入；预计利息按当前余额计算。
            - 概览首页新增「日均消费」，与收入、支出总额并排显示。
            - 修正手机版表单里被拉成过高空框的下拉菜单。
            - 应用内「历史更新」从 3.9.2 起只保留主要更新，GitHub 说明仍保留完整细节。
            - 修复了一些 BUG，电脑版与手机版同步更新。

            覆盖安装即可；升级前建议先在设置中导出一次备份。
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
