name: Release Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use the default crates.io registry in CI
        shell: pwsh
        run: Remove-Item .cargo/config.toml -ErrorAction SilentlyContinue

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build signed installer and publish draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 账页 v__VERSION__
          releaseBody: |
            账页 v__VERSION__ · 项目周期外的收支标记与项目排序

            **本次更新**

            - 项目记账新增软校验：选中项目后，日期默认推荐在项目开始到结束的区间内；手动选到区间外会显示提示，但仍可保存。
            - 项目周期外的流水会标记为「前置支出 / 后置支出」（收入为「前置收入 / 后置收入」）；流水列表、项目详情和统计页都能直接区分。
            - 统计页的项目账单会在流水发生的月份列出周期外的项目，并显示前置/后置的金额与笔数，周期外的钱不会再从报表里消失。
            - 项目列表默认按结束时间倒序；列表上方的表头可以切换「结束时间」/「立项时间」，再次点击可切换正序与倒序。
            - 修复了一些 BUG，电脑版与手机版同步更新。

            覆盖安装即可；升级前建议先在设置中导出一次备份。
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
