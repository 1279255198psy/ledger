name: Release Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use the default crates.io registry in CI
        shell: pwsh
        run: Remove-Item .cargo/config.toml -ErrorAction SilentlyContinue

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build signed installer and publish draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 账页 v__VERSION__
          releaseBody: |
            账页 Windows 安装版 v__VERSION__。

            **本次更新**

            - 分类不再局限于内置项：收入和支出分类都可以新建、改名、换颜色与图标，自定义分类与内置分类地位完全相同；已被流水或项目预算使用的分类不能删除或改变收支类型。
            - 流水页的分类筛选改为按收入、支出分组展示，自定义分类自动归入对应分组。
            - 概览新增「总结余」卡片：可以选择本月、近 6 个月、今年、全部或自定义月份范围，并在起始资金的基础上计算区间结余。
            - 起始资金支持「从零开始」或输入使用账页前已有的资金，随时可以在设置中调整；备份会一并保存分类与起始资金。
            - 项目现在可以删除：无论进行中、已结束还是已归档的项目都能删除，删除后原归入该项目的金额会自动转为日常支出，总金额不变。
            - 「结束项目」「重新启用」「恢复项目」等主要操作按钮加大，更容易点按。
            - 旧版账本、项目与备份继续兼容，升级后原有流水、预算和项目记录均保持不变。

            应用启动后会自动检查更新，发现新版本会直接弹窗；可以后台下载并继续记账，下载完成后再选择是否安装。
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
