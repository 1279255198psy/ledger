name: Release Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use the default crates.io registry in CI
        shell: pwsh
        run: Remove-Item .cargo/config.toml -ErrorAction SilentlyContinue

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build signed installer and publish draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 账页 v__VERSION__
          releaseBody: |
            账页 v__VERSION__ · 同步可靠性修复与默认账户

            **本次更新**

            - 修复手机记的账被电脑端覆盖的问题：同步比较不再把记录顺序当成改动，两端不会因为顺序不同反复互推；电脑确认收到后才推进同步基线，手机也不会用刚发出的内容覆盖本机记录。
            - 修复两端都改过起始资金时同步结果可能不一致的问题，现在两端会选中同一个值，不会来回摆动。
            - 日常同步保持安静：不再提示「新增 / 修改 / 删除」，只有同步删除了本机已有的记录时才出现一条提示，20 秒内可以点「撤销」恢复。
            - 设置 → 双端同步 → 同步历史 可以查看最近 30 次真正带来改动的同步，包括时间和双端各自新增、修改、删除、冲突的数量。
            - 设置 → 账户 新增「默认账户」：记一笔时账户一栏会先选中它，不常用微信也不用每次手动切换；这个选择只保存在当前设备。
            - 流水页的日期区间搜索不再显示 yyyy/mm/dd，空值时显示「选择日期」，点开仍用系统日历选择。
            - 电脑版与手机版同步更新。

            覆盖安装即可；升级前建议先在设置中导出一次备份。
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
