name: Release Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use the default crates.io registry in CI
        shell: pwsh
        run: Remove-Item .cargo/config.toml -ErrorAction SilentlyContinue

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build signed installer and publish draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 账页 v__VERSION__
          releaseBody: |
            账页 v__VERSION__ · 总结余按月结转

            **本次更新**

            - 概览「总结余」卡片改为按月结转：卡片里的「起始资金」显示上个月的总结余，会随所选月份变化；最早一个月从设置里的起始资金开始。
            - 总结余公式改为「上月总结余 + 该月收入 − 该月支出」，并移除卡片上的「调整起始资金 / 设置起始资金」按钮。
            - 区间统计里的第一格改为「期初结余」，按所选区间的起点计算，不再固定显示全局起始资金。
            - 设置 → 账户 仍保留起始资金，作为最早月份的初始起点；使用指南与设置里的公式说明同步更新。
            - 应用内「历史更新」更精简：只保留主要功能，关键问题修复附一句说明，小问题统一记为「修复了一些 BUG」。
            - 电脑版与手机版同步更新。

            覆盖安装即可；升级前建议先在设置中导出一次备份。
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
