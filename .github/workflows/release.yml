name: Release Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use the default crates.io registry in CI
        shell: pwsh
        run: Remove-Item .cargo/config.toml -ErrorAction SilentlyContinue

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build signed installer and publish draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 账页 v__VERSION__
          releaseBody: |
            账页 v__VERSION__ · 手机提醒修复与更柔和的提醒文字

            **本次更新**

            - 记账提醒的文案更柔和：标题改为「账页 · 记账小提醒」，内容改为「今天若有还没记下的收支，顺手记一笔就好。」
            - 修复手机版收不到自动提醒和测试提醒的问题：Android 12 及以上的「精确闹钟」特殊权限不再阻断提醒登记，改用无需额外授权的非精确闹钟，应用关闭后也能收到。
            - 手机版「发送测试提醒」现在会立即送达，不再等待系统闹钟。
            - 从系统设置授权通知后回到账页，会自动重新登记提醒；通知权限被关闭时也会给出明确提示。
            - 补充提醒的震动权限。
            - 桌面版提醒设置页新增 Windows 通知权限说明：通知开关由系统统一管理，安装后默认允许，应用不会也无法弹出授权窗口。

            已有的账本、提醒设置与外观都会保留；升级前建议先在设置中导出一次备份。
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
