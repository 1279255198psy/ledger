name: Release Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use the default crates.io registry in CI
        shell: pwsh
        run: Remove-Item .cargo/config.toml -ErrorAction SilentlyContinue

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build signed installer and publish draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 账页 v__VERSION__
          releaseBody: |
            账页 v__VERSION__ · 资债体验修正

            **本次更新**

            - 资债页默认先显示「储蓄」，不再先落到负债。
            - 定期存款到期前不能中途存入或取出；到期后可以记利息、取出或一键续存。
            - 修复在目标里新建项目会跳回首页、目标丢失的问题；现在项目会真正创建、自动选中，并出现在「项目」页。
            - 目标编辑改为弹窗，点击编辑或「重新计划」会直接在当前屏幕打开，不需要再向上滚动。
            - 推荐计划可以直接应用，也可以自定义每月储蓄金额；应用后会保存到目标上，卡片显示「已定计划、计划每月、计划达成」。
            - 推荐算法重做：综合近 6 个月收入与支出、每月还款、其他目标已承诺的储蓄、结余波动和流动资金缓冲，给出「按目标日 / 推荐 / 稳妥 / 加速」方案，并提示是否可行。
            - 所有日期输入统一为「选择日期」和稳定日期格式，不再显示 yyyy/mm；储蓄与目标里的下拉菜单改用应用统一的样式。
            - 修复了一些 BUG，电脑版与手机版同步更新。

            覆盖安装即可；升级前建议先在设置中导出一次备份。
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
