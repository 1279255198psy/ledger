name: Release Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use the default crates.io registry in CI
        shell: pwsh
        run: Remove-Item .cargo/config.toml -ErrorAction SilentlyContinue

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build signed installer and publish draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 账页 v__VERSION__
          releaseBody: |
            账页 v__VERSION__ · 定时记账提醒与手机端通知

            **本次更新**

            - 设置中新增「记账提醒」：默认开启，每天 21:00 提醒一次，记账不再容易忘。
            - 提醒时间可以改成任意整点分钟；频率可选每天、工作日、周末，或自定义星期几。
            - 随时可以关闭提醒；关闭后不会再发送任何通知。
            - 桌面版默认开机自启并最小化到托盘，关闭主窗口不会退出应用，到点仍会发出系统通知；也可在提醒设置里关掉开机自启。
            - 手机版使用系统本地通知，即使没有打开账页也能按时收到提醒；首次开启时会请求通知权限，并可在设置页发送测试提醒确认效果。
            - 提醒设置会随账本一起保存，升级后自动沿用。
            - 手机版流水页的「全部账户」筛选改成与旁边「全部分类」一致的弹出面板，选项和选中状态更清楚。

            已有的账本与外观设置都会保留；升级前建议先在设置中导出一次备份。
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
