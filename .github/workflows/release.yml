name: Release Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use the default crates.io registry in CI
        shell: pwsh
        run: Remove-Item .cargo/config.toml -ErrorAction SilentlyContinue

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build signed installer and publish draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 账页 v__VERSION__
          releaseBody: |
            账页 Windows 安装版 v__VERSION__。

            **本次更新**

            - 新增「日常 / 项目 / 共用」三种归属：一笔支出可以全部计入生活，也可以归入某个项目，或同时分摊给日常与多个项目。
            - 共用支出支持按比例或固定金额分摊，自动用最大余数法对齐到分；餐费、房租、水电等不再需要拆成多笔记录。
            - 概览与统计页区分「生活支出」「项目支出」「支出总额」：月度预算只绑定生活支出，项目花费单独展示，不会被误算进个人预算。
            - 新增项目账单：查看项目总支出、本月归集、截至本月累计、预算进度与逐月明细；跨月项目保留完整总账，并按交易发生月份进入对应月报。
            - 设置中新增项目管理：创建项目、设置预算、结束 / 重启、归档 / 恢复；已有流水不会因项目归档而丢失。
            - 流水列表标出「项目 / 共用」归属，方便快速核对。
            - 旧版账本首次启动时自动升级到新版数据结构，原有流水默认全部计入日常账，无需手动迁移。

            应用启动后会自动检查更新，发现新版本会直接弹窗；可以后台下载并继续记账，下载完成后再选择是否安装。
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
