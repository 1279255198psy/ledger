name: Release Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use the default crates.io registry in CI
        shell: pwsh
        run: Remove-Item .cargo/config.toml -ErrorAction SilentlyContinue

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build signed installer and publish draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 账页 v__VERSION__
          releaseBody: |
            账页 v__VERSION__ · 指数扩展与设置整理

            **本次更新**

            - 设置里的「起始资金」与「货币」并入「账户」页，和账户管理放在一起，不再单独占两个入口。
            - 使用指南按当前功能重写为十个小主题：记一笔、周期记账、流水与筛选、预算、项目、负债、账户、统计与指数、记账提醒、同步与备份。
            - 指数页新增收入稳定性、支出波动率、预算执行率、净资产增长率、负债清零月数五项指标，可自行勾选显示；其中预算执行率、净资产增长率、支出波动率默认显示。
            - 综合财务健康度改为只计入当前显示的指标：隐藏的指标不影响得分，勾选或取消会立即改变得分，历史月份的得分也按当前显示口径重算。
            - 预算执行率按原定月预算比较，预算上调或下调不会改变判定；只统计近 6 个完整月份里确实设过预算的月份。
            - 电脑版与手机版同步更新。

            覆盖安装即可；升级前建议先在设置中导出一次备份。
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
