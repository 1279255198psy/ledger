name: Release Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use the default crates.io registry in CI
        shell: pwsh
        run: Remove-Item .cargo/config.toml -ErrorAction SilentlyContinue

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build signed installer and publish draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 账页 v__VERSION__
          releaseBody: |
            账页 v__VERSION__ · 目标项目日期与手机显示

            **本次更新**

            - 在目标里直接新建项目时，表单改为「项目名称 / 起始日期 / 项目预算」；你在目标里选的日期现在作为项目起始日，项目没有结束日期，是一个长期项目。
            - 这样创建的项目与在项目页新建的独立核算项目完全一致，不再被当成从今天延续到目标日的短期项目。
            - 手机版储蓄中较长的存单名称会自动换行；金额指标改为两列，必要时继续换行，不再用省略号截断。
            - 储蓄汇总的大额数字和目标进度金额也改为换行显示，手机上能看全。
            - 修复了一些 BUG，电脑版与手机版同步更新。

            覆盖安装即可；升级前建议先在设置中导出一次备份。
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
