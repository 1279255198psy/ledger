<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="gold" x1="18" y1="12" x2="112" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F2DDA8"/>
      <stop offset="0.42" stop-color="#CFA961"/>
      <stop offset="0.72" stop-color="#B58D49"/>
      <stop offset="1" stop-color="#916D31"/>
    </linearGradient>
    <linearGradient id="pageLeft" x1="14" y1="22" x2="64" y2="112" gradientUnits="userSpaceOnUse">
      <stop stop-color="#272119"/>
      <stop offset="1" stop-color="#15120E"/>
    </linearGradient>
    <linearGradient id="pageRight" x1="114" y1="22" x2="64" y2="112" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2B241A"/>
      <stop offset="1" stop-color="#17130E"/>
    </linearGradient>
    <radialGradient id="dot" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#F2DDA8"/>
      <stop offset="1" stop-color="#CFA961"/>
    </radialGradient>
  </defs>

  <!-- The open ledger. -->
  <path
    d="M64 34C55.5 26.5 44 22.5 31 22.5H12V100H31C44 100 55.5 104 64 111.5Z"
    fill="url(#pageLeft)"
    stroke="url(#gold)"
    stroke-width="2.4"
    stroke-linejoin="round"
  />
  <path
    d="M64 34C72.5 26.5 84 22.5 97 22.5H116V100H97C84 100 72.5 104 64 111.5Z"
    fill="url(#pageRight)"
    stroke="url(#gold)"
    stroke-width="2.4"
    stroke-linejoin="round"
  />

  <!-- Gutter. -->
  <path d="M64 35V110" stroke="url(#gold)" stroke-width="1.5" opacity="0.7"/>

  <!-- Entries on the left page. -->
  <path
    d="M27 48H52M27 60H48M27 72H43"
    stroke="url(#gold)"
    stroke-width="2.5"
    stroke-linecap="round"
    opacity="0.9"
  />

  <!-- Direction on the right page. -->
  <path
    d="M76 86L86 72L95 78L107 56"
    fill="none"
    stroke="url(#gold)"
    stroke-width="2.7"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <circle cx="107" cy="56" r="5.2" fill="url(#dot)" opacity="0.22"/>
  <circle cx="107" cy="56" r="3" fill="url(#dot)"/>
</svg>
